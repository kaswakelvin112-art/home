<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/scattered clouds.png">
    <link rel="stylesheet" href="style.css" />
    <title>Weather Now</title>
  </head>
  <body>
    <div class="card">
      <div class="search" role="search">
        <input id="search" type="search" placeholder="Enter City name" />
        <div class="search-icon">
          <svg id="search-btn"
            xmlns="http://www.w3.org/2000/svg"
            width="25"
            height="25"
            viewBox="0 0 512 512"
          >
            <path
              d="M456.69,421.39,362.6,327.3a173.81,173.81,0,0,0,34.84-104.58C397.44,126.38,319.06,48,222.72,48S48,126.38,48,222.72s78.38,174.72,174.72,174.72A173.81,173.81,0,0,0,327.3,362.6l94.09,94.09a25,25,0,0,0,35.3-35.3ZM97.92,222.72a124.8,124.8,0,1,1,124.8,124.8A124.95,124.95,0,0,1,97.92,222.72Z"
            />
          </svg>
        </div>
      </div>
      <p class="warning" role="warning"></p>
      <main class="weather-Now" hidden>
        <div class="weather-Now">
          <img class="weather-icon" src="images/sun.png" alt="sunny and cloudy" />
          <p><small id="description"></small></p>
          <hr>
          <h1 id="temp"></h1>
          <h2 id="city"></h2>
          <div class="details">
            <div class="col windy">
                <img src="images/windy.png" alt="wind speed">
                <div>
                    <p id="wind"></p>
                    <p>Wind Speed</p>
                </div>
            </div>
            <div class="col humidity">
                <img src="images/humidity.png" alt="humidity">
                <div>
                        <p id="humidity"></p>
                    <p>Humidity</p>
                </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
